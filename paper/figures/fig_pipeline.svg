<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470"
     font-family="Times New Roman, STIXGeneral, Georgia, serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8.4" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="470" fill="#FFFFFF"/>

  <!-- Input and Phase A: barrierless fast path -->
  <text x="88" y="100" text-anchor="end" font-size="12" fill="#333333">q₀, T_target</text>
  <line x1="96" y1="95" x2="124" y2="95" stroke="#333333" stroke-width="1.8"
        marker-end="url(#arrowhead)"/>

  <rect x="126" y="30" width="286" height="131" rx="6"
        fill="#009E73" fill-opacity="0.08" stroke="#009E73" stroke-width="2"/>
  <text x="269" y="54" text-anchor="middle" font-size="15.5" font-weight="bold"
        letter-spacing="0.35" fill="#333333">PHASE A — barrierless ensemble</text>
  <text x="269" y="75" text-anchor="middle" font-size="12" fill="#333333">max_replicas = 6  (one budget, shared with Phase B)</text>
  <text x="269" y="90" text-anchor="middle" font-size="12" fill="#333333">replica 0 ← q₀,  replicas 1–5 ← random</text>
  <text x="269" y="105" text-anchor="middle" font-size="12" fill="#333333">adaptive LM polish, ≤ 30 steps · <tspan fill="#009E73" font-weight="bold">Eq. 18</tspan></text>
  <text x="269" y="120" text-anchor="middle" font-size="12" fill="#333333">λ₀ = 0.08, self-tuning on accept / reject</text>
  <text x="269" y="135" text-anchor="middle" font-size="12" fill="#333333">stop at first converged replica with d(q) ≥ 0</text>
  <text x="269" y="150" text-anchor="middle" font-size="11.5" font-style="italic"
        fill="#7A7A7A">kinetic partitioning — the barrierless fraction</text>

  <line x1="412" y1="95" x2="442" y2="95" stroke="#333333" stroke-width="1.8"
        marker-end="url(#arrowhead)"/>

  <!-- Frustration gate -->
  <polygon points="444,95 532,35 620,95 532,155" fill="none"
           stroke="#E69F00" stroke-width="2"/>
  <text x="532" y="82" text-anchor="middle" font-size="14" font-weight="bold"
        fill="#333333">frustrated?</text>
  <text x="532" y="101" text-anchor="middle" font-size="11.5" fill="#333333">no converged replica</text>
  <text x="532" y="116" text-anchor="middle" font-size="11.5" fill="#333333">is clash-free</text>

  <!-- No: common fast path, routed clear of Phase B -->
  <polyline points="620,95 900,95 900,194" fill="none" stroke="#333333" stroke-width="1.8"
            stroke-linejoin="miter" marker-end="url(#arrowhead)"/>
  <text x="760" y="75" text-anchor="middle" font-size="11.5" fill="#333333">no</text>
  <text x="760" y="89" text-anchor="middle" font-size="11.5" fill="#333333">79% fast path</text>

  <!-- Yes: escalate to Phase B -->
  <line x1="532" y1="155" x2="532" y2="198" stroke="#333333" stroke-width="1.8"
        marker-end="url(#arrowhead)"/>
  <text x="546" y="171" text-anchor="start" font-size="11.5" fill="#333333">yes</text>
  <text x="546" y="185" text-anchor="start" font-size="11.5" fill="#333333">21% escalate</text>

  <!-- Phase B: staged fold, only for frustrated targets -->
  <rect x="126" y="200" width="650" height="170" rx="6"
        fill="#CC79A7" fill-opacity="0.08" stroke="#CC79A7" stroke-width="2"/>
  <text x="142" y="220" text-anchor="start" font-size="15.5" font-weight="bold"
        letter-spacing="0.35" fill="#333333">PHASE B — the full staged fold</text>
  <text x="760" y="220" text-anchor="end" font-size="11.5" font-style="italic"
        fill="#7A7A7A">frustrated targets only · stops on the first clean fold</text>

  <!-- B1 -->
  <rect x="142" y="254" width="164" height="100" rx="6"
        fill="#CC79A7" fill-opacity="0.08" stroke="#CC79A7" stroke-width="2"/>
  <text x="224" y="279" text-anchor="middle" font-size="15.5" font-weight="bold"
        fill="#333333">coarse collapse</text>
  <text x="224" y="299" text-anchor="middle" font-size="12" fill="#333333">detuned DLS · <tspan fill="#CC79A7" font-weight="bold">Eq. 13</tspan></text>
  <text x="224" y="314" text-anchor="middle" font-size="12" fill="#333333">10·δ iterations,  δ ∈ [1, 3]</text>
  <text x="224" y="337" text-anchor="middle" font-size="11.5" font-style="italic"
        fill="#7A7A7A">hydrophobic collapse</text>

  <line x1="306" y1="296" x2="328" y2="296" stroke="#333333" stroke-width="1.8"
        marker-end="url(#arrowhead)"/>

  <!-- B2 -->
  <rect x="328" y="254" width="216" height="100" rx="6"
        fill="#CC79A7" fill-opacity="0.08" stroke="#CC79A7" stroke-width="2"/>
  <text x="436" y="277" text-anchor="middle" font-size="15.5" font-weight="bold"
        fill="#333333">Metropolis funnel  ★</text>
  <text x="436" y="296" text-anchor="middle" font-size="12" fill="#333333">150 iterations · <tspan fill="#CC79A7" font-weight="bold">Eqs. 19–20</tspan></text>
  <text x="436" y="311" text-anchor="middle" font-size="12" fill="#333333">single-joint proposals, rₜ = 0.5 · 0.985ᵗ</text>
  <text x="436" y="326" text-anchor="middle" font-size="12" fill="#333333">geometric cooling T₀ = 0.3 → T_f = 0.01</text>
  <text x="436" y="343" text-anchor="middle" font-size="11.5" font-style="italic"
        fill="#7A7A7A">folding funnel</text>

  <line x1="544" y1="290" x2="566" y2="290" stroke="#333333" stroke-width="1.8"
        marker-end="url(#arrowhead)"/>
  <text x="555" y="281" text-anchor="middle" font-size="11.5" fill="#333333">stall</text>

  <!-- B3 -->
  <rect x="566" y="254" width="194" height="100" rx="6"
        fill="#CC79A7" fill-opacity="0.08" stroke="#CC79A7" stroke-width="2"/>
  <text x="663" y="277" text-anchor="middle" font-size="15.5" font-weight="bold"
        fill="#333333">analytic rescue  ★</text>
  <text x="663" y="296" text-anchor="middle" font-size="12" fill="#333333">stall: 10-window progress &lt; 2e−4</text>
  <text x="663" y="311" text-anchor="middle" font-size="12" fill="#333333">joint i* = argmaxᵢ φᵢ · <tspan fill="#CC79A7" font-weight="bold">Eq. 21</tspan></text>
  <text x="663" y="326" text-anchor="middle" font-size="12" fill="#333333">scope ladder [n/6, n/2, 5n/6, n]</text>
  <text x="663" y="343" text-anchor="middle" font-size="11.5" font-style="italic"
        fill="#7A7A7A">chaperone action (GroEL)</text>

  <!-- Rescue loop-back inside the Phase B container -->
  <polyline points="663,354 663,364 436,364 436,354" fill="none"
            stroke="#333333" stroke-width="1.8" stroke-linejoin="miter"
            marker-end="url(#arrowhead)"/>

  <!-- Phase B converges into the shared terminal path -->
  <line x1="776" y1="270" x2="800" y2="270" stroke="#333333" stroke-width="1.8"
        marker-end="url(#arrowhead)"/>
  <text x="789" y="261" text-anchor="middle" font-size="11.5" fill="#333333"
        transform="rotate(-90 789 261)">converged</text>

  <!-- Shared SELECT and stability gate -->
  <rect x="800" y="194" width="190" height="96" rx="6"
        fill="#333333" fill-opacity="0.08" stroke="#333333" stroke-width="2"/>
  <text x="895" y="216" text-anchor="middle" font-size="15.5" font-weight="bold"
        fill="#333333">SELECT</text>
  <text x="895" y="239" text-anchor="middle" font-size="12" fill="#333333">argmax d(q) over every</text>
  <text x="895" y="254" text-anchor="middle" font-size="12" fill="#333333">converged candidate,</text>
  <text x="895" y="269" text-anchor="middle" font-size="12" fill="#333333">both phases</text>

  <line x1="895" y1="290" x2="895" y2="326" stroke="#333333" stroke-width="1.8"
        marker-end="url(#arrowhead)"/>

  <rect x="800" y="326" width="190" height="111" rx="6"
        fill="#333333" fill-opacity="0.08" stroke="#333333" stroke-width="2"/>
  <text x="895" y="350" text-anchor="middle" font-size="15.5" font-weight="bold"
        fill="#333333">STABILITY GATE</text>
  <text x="895" y="369" text-anchor="middle" font-size="12" fill="#333333">5 jitters, σ ≈ 1 mm tip</text>
  <text x="895" y="384" text-anchor="middle" font-size="12" fill="#333333">reject if <tspan fill="#333333" font-weight="bold">Eq. 7</tspan> error rises</text>
  <text x="895" y="399" text-anchor="middle" font-size="12" fill="#333333">by &gt; 10 tolerances</text>
  <text x="895" y="414" text-anchor="middle" font-size="12" fill="#333333">on ≥ 4 of 5 trials</text>
  <text x="895" y="426" text-anchor="middle" font-size="11.5" font-style="italic"
        fill="#7A7A7A">native-state stability</text>

  <line x1="895" y1="437" x2="895" y2="444" stroke="#333333" stroke-width="1.8"
        marker-end="url(#arrowhead)"/>
  <text x="895" y="460" text-anchor="middle" font-size="15.5" font-weight="bold"
        fill="#333333">q*</text>

  <!-- Figure notes -->
  <text x="126" y="452" text-anchor="start" font-size="11" fill="#333333">★ replaces StagedFold's greedy Eq. 15 and finite-difference Eq. 17.  Italic labels name the folding process each element ports.</text>
  <text x="126" y="464" text-anchor="start" font-size="11" fill="#333333">Gate shares measured on UR5 + Franka, n = 1800.</text>
</svg>
